[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# The 155-violation adoption-time baseline (docs/decisions/2026-09-15-adopt-ruff-linter.md)
# was resolved via pure-extraction refactors + a formal E501 exception
# (docs/decisions/2026-09-21-ruff-complexity-refactor.md); ruff check .
# is now 0 errors full-repo and enforced as a hard pre-push gate
# (githooks/pre-push, docs/decisions/2026-09-21-ruff-pre-commit-gate.md,
# docs/decisions/2026-09-22-coverage-baseline-close-and-hard-gate.md).
[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
# E/F/W: standard pycodestyle errors/warnings + pyflakes (unused
# imports/names, obvious bugs). C90 + PLR09xx: the modularity-relevant
# categories -- mccabe cyclomatic complexity, and Pylint's too-many-
# returns/branches/arguments/statements refactor rules. PLR0402: a
# free, zero-noise style nit (import x.y as y -> from x import y).
# PLR2004: magic-value-comparison -- see per-file-ignores below, its
# ~93% hit rate in tests/ is expected/idiomatic (test assertions
# comparing to literal expected values), not a real finding there.
# None of these PLR/C90 codes are enabled by ruff's own defaults; all
# must be selected explicitly. See
# docs/decisions/2026-09-15-expand-ruff-plr-rules.md for the
# full-PLR-family survey behind this specific selection.
select = ["E", "F", "W", "C90", "PLR0402", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Test assertions comparing to literal expected values are the normal,
# idiomatic pattern -- PLR2004 flagging them is noise, not signal (93 of
# 97 hits repo-wide were here; see the decision file above).
#
# E501: test files are dominated by single-line XBRL/API-response
# fixture dicts (spot-checked -- e.g. test_formulas.py/test_xbrl_facts.py's
# longest lines) that are more readable and easier to diff against real
# API responses kept on one line than wrapped -- wrapping them is a
# cosmetic cost for no real readability gain. This glob matches
# recursively (verified directly: a scratch long line dropped into
# tests/manual/ was silenced too), so it also covers the
# tests/manual/verify_*.py live-verification scripts -- accepted
# alongside the fixture-dict files above, not narrowed to exclude them,
# since those scripts are exploratory/manual by nature and not held to
# the same line-length discipline as the main source tree either. See
# docs/decisions/2026-09-21-ruff-complexity-refactor.md.
"tests/*" = ["PLR2004", "E501"]

# basic, not strict: strict mode's real baseline was 4,655 errors, ~94%
# of them Unknown-type-propagation noise from this codebase's dict-
# shaped data flow, not real gaps. basic mode's baseline was 154 --
# comparable to ruff's own original 155-violation baseline -- with
# real, fixable findings. See docs/decisions/2026-09-15-adopt-pyright.md.
# The 117-error baseline that remained after that adoption (all in
# pre-existing test files) was closed on 2026-09-22 via type-narrowing
# assertions/casts, zero logic change -- see
# docs/decisions/2026-09-22-pyright-clean-refactor.md. pyright . is now
# 0 errors full-repo and, like ruff (see [tool.ruff] above), enforced
# as a hard pre-push gate (githooks/pre-push) -- see
# docs/decisions/2026-09-22-pyright-pre-commit-gate.md,
# docs/decisions/2026-09-22-coverage-baseline-close-and-hard-gate.md.
[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
exclude = [
    ".venv",
    "**/__pycache__",
    "chroma_db",
    "chunks",
    "data",
    "xbrl_cache",
    "trace_logs",
]

# Branch coverage, enabled 2026-09-22 after measuring the real impact
# first (mirrors this project's own "measure before escalating"
# habit): repo-wide, branch mode added only 30 partial branches out of
# 714 total, aggregate barely moved (~90% either way) -- no
# pyright-strict-style noise blowup. diff-cover's own separate
# --branch-coverage flag is deliberately NOT enabled yet -- that's a
# second, independent escalation (penalizing partial branches on a
# diff specifically), and no diff-scoped data exists to justify it, only
# this repo-wide historical measurement. See
# docs/decisions/2026-09-22-coverage-baseline-close-and-hard-gate.md
# (amends docs/decisions/2026-09-22-adopt-pytest-coverage.md's original
# line-coverage choice).
[tool.coverage.run]
branch = true
source = ["."]
omit = [".venv/*", "tests/*", "chroma_db/*", "chunks/*", "data/*", "xbrl_cache/*", "trace_logs/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]
